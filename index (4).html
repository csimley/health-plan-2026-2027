<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Return to Soccer: Daily Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#14211A; --muted:#56665D; --line:#D3DCD5;
  --train:#2B6A49; --train-soft:#E1EEE6; --food:#2A5B8A; --food-soft:#E2EBF5;
  --note:#7E520E; --note-soft:#F7ECD6; --p1:#BFD9C8; --p2:#8FBEA2; --p3:#5C9C78; --p4:#2B6A49;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1511; --surface:#161F1A; --ink:#E6EEE8; --muted:#9AAEA2; --line:#2A3830;
    --train:#6FC798; --train-soft:#1B3125; --food:#86B6E8; --food-soft:#17283A;
    --note:#E7B45A; --note-soft:#33280F; --p1:#24402F; --p2:#2F5A41; --p3:#3F7F5A; --p4:#6FC798;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1511; --surface:#161F1A; --ink:#E6EEE8; --muted:#9AAEA2; --line:#2A3830;
  --train:#6FC798; --train-soft:#1B3125; --food:#86B6E8; --food-soft:#17283A;
  --note:#E7B45A; --note-soft:#33280F; --p1:#24402F; --p2:#2F5A41; --p3:#3F7F5A; --p4:#6FC798;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:3px solid var(--train);outline-offset:2px;border-radius:6px}
.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}

.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px}
.brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:20px;letter-spacing:.01em}
.today-btn{font-weight:600;font-size:15px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--ink)}
.today-btn[disabled]{opacity:.35;cursor:default}

.wrap{max-width:640px;margin:0 auto;padding:0 18px 56px}

.hero{padding:22px 0 14px}
.hero-date{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(46px,14vw,68px);line-height:.92;letter-spacing:-.005em;margin:0}
.hero-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px;color:var(--muted);font-weight:500}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:14px;background:var(--train-soft);color:var(--train)}
.pill.food{background:var(--food-soft);color:var(--food)}
.pill.plain{background:transparent;border:1.5px solid var(--line);color:var(--ink)}

.season{margin:6px 0 18px}
.season-bar{display:grid;grid-template-columns:repeat(21,1fr);gap:3px}
.seg{height:22px;border-radius:4px;position:relative}
.seg.p1{background:var(--p1)}.seg.p2{background:var(--p2)}.seg.p3{background:var(--p3)}.seg.p4{background:var(--p4)}
.seg.cur{outline:2.5px solid var(--ink);outline-offset:1.5px}
.seg.dl::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--bg)}
.season-key{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}

.week{display:flex;align-items:stretch;gap:6px;margin-bottom:14px}
.wk-nav{flex:0 0 34px;display:grid;place-items:center;border-radius:10px;border:1.5px solid var(--line);font-size:18px}
.wk-nav[disabled]{opacity:.3;cursor:default}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line)}
.day .dl1{font-size:12px;color:var(--muted);font-weight:600}
.day .dn{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:22px;line-height:1}
.day .bar{width:60%;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
.day .bar i{display:block;height:100%;background:var(--train)}
.day.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day.sel .dl1{color:var(--bg);opacity:.8}
.day.sel .bar{background:rgba(127,127,127,.45)}
.day.sel .bar i{background:var(--bg)}
.day.today .dn{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

.notes{display:grid;gap:8px;margin-bottom:14px}
.note{background:var(--note-soft);color:var(--ink);border-left:4px solid var(--note);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.note b{color:var(--note)}

.progress{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.progress .track{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress .track i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
.progress span{font-weight:600;font-size:15px;white-space:nowrap}

.tabs{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 52px);z-index:4;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 0 10px}
.tab{padding:10px 0;border-radius:12px;font-weight:600;text-align:center;border:1.5px solid var(--line);background:var(--surface)}
.tab .cnt{font-weight:500;color:var(--muted);font-size:14px;margin-left:4px}
.tab.on.t{background:var(--train);border-color:var(--train);color:var(--bg)}
.tab.on.f{background:var(--food);border-color:var(--food);color:var(--bg)}
.tab.on .cnt{color:inherit;opacity:.85}

.panel{--accent:var(--train);--accent-soft:var(--train-soft)}
.panel.food{--accent:var(--food);--accent-soft:var(--food-soft)}
.session-title{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:30px;line-height:1.05;margin:6px 0 2px}
.session-meta{color:var(--muted);margin:0 0 6px}
.targets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 6px}
.t-box{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.t-box b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:21px;line-height:1.1}
.t-box span{font-size:12px;color:var(--muted)}

.group{margin-top:20px}
.group h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:21px;margin:0 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.group h3 small{font-family:"Barlow",system-ui,sans-serif;font-weight:500;font-size:14px;color:var(--muted)}
ul.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px}
.check{flex:0 0 30px;height:30px;border-radius:9px;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.check svg{width:18px;height:18px;opacity:0}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .check svg{opacity:1;color:var(--bg)}
.task.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.tbody{flex:1;min-width:0}
.ttl{display:block;width:100%;font-weight:600;line-height:1.3}
.ttl .chev{float:right;margin-left:8px;color:var(--muted);transition:transform .2s ease;font-weight:500}
.ttl[aria-expanded="true"] .chev{transform:rotate(90deg)}
.meta{display:block;color:var(--muted);font-weight:500;font-size:15px;margin-top:2px}
.detail{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:15px;color:var(--ink)}
.detail p{margin:0 0 6px}
.detail ol,.detail ul{margin:0;padding-left:20px}
.detail li{margin:0 0 5px}
.detail .mac{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:8px;padding:2px 8px;margin:2px 0 6px}
.detail a{color:var(--accent);font-weight:600}
.foot{margin-top:28px;color:var(--muted);font-size:14px}
.foot a{color:var(--ink);font-weight:600}
.tabs{grid-template-columns:repeat(4,1fr);gap:5px}
.tab{padding:8px 2px;font-size:15px;line-height:1.2}
.tab .cnt{display:block;margin:2px 0 0;font-size:12px}
.tab.on.r,.tab.on.g{background:var(--food);border-color:var(--food);color:var(--bg)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 2px}
.chip{padding:7px 4px;text-align:center;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.chip.on{background:var(--food);border-color:var(--food);color:var(--bg)}
ul.rlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rc{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.rc-h{display:grid;grid-template-columns:1fr auto;width:100%;gap:2px 10px}
.rc-day{grid-column:1;font-size:13px;font-weight:600;color:var(--accent)}
.rc-t{grid-column:1;font-weight:600;line-height:1.3}
.rc-h .chev{grid-column:2;grid-row:1 / span 2;align-self:center;color:var(--muted);transition:transform .2s ease;font-size:20px}
.rc.open .chev{transform:rotate(90deg)}
.rc-b{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:15px}
.rc-b h4{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:19px;margin:12px 0 4px}
.rc-b ul,.rc-b ol{margin:0;padding-left:20px}
.rc-b li{margin:0 0 6px}
.rc-b p{margin:8px 0 0}
.rc-time{color:var(--muted);margin:0}
.rc-b .mac{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:8px;padding:2px 8px}
.lnk{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.foot .lnk{color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="brand">Return to soccer</span>
    <button class="today-btn" id="todayBtn" type="button">Today</button>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
var RCP={
1:[
{t:"Crockpot Honey-Garlic Chicken with Brown Rice and Green Beans",time:"Active 15 min (10 at lunch, 5 at dinner). Total about 5 hours.",
ing:["2 lb boneless skinless chicken breasts","⅓ cup honey","¼ cup low-sodium soy sauce","1 tbsp apple cider vinegar","4 garlic cloves, minced","½ small onion, finely chopped","½ tsp ground ginger","¼ tsp black pepper","1 tbsp cornstarch mixed with 2 tbsp cold water","2 cups dry quick-cook brown rice","2 steam-in-bag packs frozen green beans"],
st:["<b>At lunch:</b> whisk the honey, soy sauce, vinegar, garlic, onion, ginger, and pepper together in the crockpot.","Add the chicken and turn it to coat. Cover and cook on LOW 4–5 hours, until the chicken reaches 165°F.","<b>At dinner:</b> cook the rice according to the package.","Move the chicken to a cutting board and shred it with two forks, or slice it.","Pour the sauce into a small saucepan and bring it to a simmer. Whisk in the cornstarch mixture and simmer 1–2 min, until glossy. Stir the chicken back in.","Microwave the green beans according to the bag.","Serve the chicken and sauce over the rice with the green beans."],
plate:"6 oz chicken, 1 cup rice, 1 cup green beans. Pack the same for Tuesday’s lunch.",tip:"Save the extra rice (about 3 cups) for Tuesday’s burrito bowls."},
{t:"Salmon Burrito Bowls",time:"Active 10 min. Total 20 min.",
ing:["2 lb salmon fillets, thawed","1 tbsp olive oil","<b>Rub:</b> 2 tsp mild chili powder, 1½ tsp ground cumin, 1 tsp garlic powder, ½ tsp smoked paprika, ½ tsp salt, ¼ tsp black pepper","1 can (15 oz) black beans, drained and rinsed","1½ cups frozen corn","½ tsp ground cumin and 2 tbsp water for the beans","About 3 cups leftover brown rice from Monday","2 limes, cut into wedges"],
st:["Heat the oven to 400°F and line a sheet pan.","Pat the salmon dry, brush it with the oil, and sprinkle the rub over the top. For your son’s piece, use just salt and garlic powder if he doesn’t like the chili flavor.","Bake 12–15 min, until the salmon flakes easily (145°F).","Meanwhile, warm the beans, corn, cumin, and water in a saucepan over medium for 5 min.","Reheat the rice in the microwave, covered, with a splash of water for 2–3 min.","Flake the salmon into large pieces, leaving the skin behind. Build bowls with rice, beans and corn, then salmon, and finish with lime."],
plate:"6 oz salmon, ¾ cup rice, ½ cup beans, ½ cup corn. Pack the same for Wednesday’s lunch.",tip:"Reheat salmon at 50% power for 1–2 min, or eat the lunch bowl cold. Full power dries it out."},
{t:"Crockpot Mongolian Beef over Whole-Wheat Spaghetti",time:"Active 25 min (15 at lunch, 10 at dinner). Total about 5 hours.",
ing:["2 lb flank steak","2 tbsp cornstarch","½ cup low-sodium soy sauce","⅓ cup honey","½ cup water","4 garlic cloves, minced","½ tsp ground ginger","1 tsp sesame oil","½ small onion, thinly sliced","¼ tsp red pepper flakes (optional; leave out for your son)","12 oz whole-wheat spaghetti","1 lb carrots, sliced into thin coins","1 steam-in-bag pack frozen green beans"],
st:["<b>At lunch:</b> slice the flank steak against the grain into ¼-inch strips. It slices more easily while still a little firm, or after 20 min in the freezer. Toss the strips with the cornstarch.","Whisk the soy sauce, honey, water, garlic, ginger, sesame oil, and pepper flakes in the crockpot. Add the onion and beef and stir to coat. Cook on LOW 4–5 hours.","<b>At dinner:</b> boil the spaghetti 9–10 min and drain.","Microwave the carrots in a covered bowl with 2 tbsp water for 5–6 min. Microwave the green beans according to the bag.","Toss the spaghetti with about ½ cup of the sauce and serve the beef over the noodles."],
plate:"5 oz beef, 1 cup spaghetti, 2 tbsp sauce, 1 cup carrots and green beans. Pack the same for Thursday’s lunch.",tip:"Look for the long lines running through the meat and slice across them. That’s what makes flank steak tender."},
{t:"Crockpot BBQ Pulled Chicken Sandwiches, Potato Wedges, Peas and Carrots",time:"Active 20 min (5 at lunch, 15 at dinner). Total about 5 hours.",
ing:["2 lb boneless skinless chicken breasts","1 cup low-sodium chicken broth","½ small onion, finely chopped","3 garlic cloves, minced","1 tsp smoked paprika, ½ tsp garlic powder, ¼ tsp black pepper","¾ cup BBQ sauce","6 whole-wheat hamburger buns","<b>Wedges:</b> 1½ lb russet potatoes (about 3), skins on, each cut into 8 wedges; 1 tbsp olive oil; ½ tsp smoked paprika; ½ tsp garlic powder; ¼ tsp salt (or a bag of frozen wedges)","1 bag frozen peas and carrots"],
st:["<b>At lunch:</b> put the chicken in the crockpot and sprinkle it with the paprika, garlic powder, and pepper. Add the onion, garlic, and broth. Cook on LOW 4–5 hours, until 165°F.","<b>At dinner:</b> heat the oven to 425°F. Toss the wedges with the oil and seasonings and roast 25–30 min, flipping halfway.","Shred the chicken in a bowl. Pour off all but ¼ cup of the liquid, return the chicken, and stir in the BBQ sauce. Keep on WARM.","Microwave the peas and carrots. Toast the buns under the broiler 1–2 min.","Pile the chicken on the buns and serve with the wedges and vegetables."],
plate:"5 oz chicken on 1 bun, 150 g wedges, 1 cup peas and carrots.",tip:"Pack Friday’s lunch with the chicken and bun separate so the bun doesn’t get soggy."},
{t:"Sheet-Pan Pork Tenderloin with Sweet Potatoes and Brussels Sprouts",time:"Active 15 min. Total 40 min.",
ing:["2 pork tenderloins (about 1 lb each)","2½ lb sweet potatoes, skins on, ¾-inch cubes","1½ lb Brussels sprouts, trimmed and halved","2 tbsp olive oil, divided","½ tsp salt, divided","½ tsp each black pepper, smoked paprika, and garlic powder for the vegetables","<b>Honey-mustard glaze:</b> 2 tbsp Dijon, 1 tbsp honey, 2 minced garlic cloves, ½ tsp dried thyme, plus ¼ tsp salt for the pork","<b>Or smoky chili-lime rub:</b> 2 tsp mild chili powder, 1½ tsp cumin, 1 tsp smoked paprika, 1 tsp garlic powder, ½ tsp oregano, ¾ tsp salt, ½ tsp pepper, 1 tbsp olive oil, and 1–2 limes"],
st:["Heat the oven to 425°F and line 2 sheet pans.","Pan 1: toss the sweet potatoes with 1 tbsp oil, ¼ tsp salt, and the paprika (or 1 tsp of the chili-lime rub). Pan 2: toss the sprouts with 1 tbsp oil, ¼ tsp salt, pepper, and garlic powder, cut-side down. Roast both 10 min.","Pat the tenderloins dry and trim the thin silvery membrane. For honey-mustard, season with ¼ tsp salt and brush on the glaze. For chili-lime, coat with 1 tbsp oil and press on the rub.","Push the sweet potatoes aside, set the pork in the middle, and roast 18–22 min more, to 145°F.","Rest 5 min, slice ½ inch thick, and squeeze lime over it if you used the chili-lime rub."],
plate:"6 oz pork, 250 g sweet potato, 1 cup sprouts. Pack the same for Saturday’s lunch.",tip:"If the sprouts brown early, pull that pan. Store leftover pork whole so it stays juicy."},
{t:"Lemon-Garlic Baked Cod with Smashed Potatoes and Roasted Asparagus",time:"Active 25 min. Total 35 min.",
ing:["2½ lb cod fillets, thawed, about 1 inch thick","<b>Lemon-garlic oil:</b> 2 tbsp olive oil, 3 minced garlic cloves, zest of 1 lemon plus 1 tbsp juice, ½ tsp smoked paprika, ½ tsp salt, ¼ tsp pepper","1 lemon, cut into wedges","<b>Potatoes:</b> 2 lb russet or yellow potatoes, skins on, 2-inch chunks; 3 whole peeled garlic cloves; 1 tbsp olive oil; ⅓ cup warm lactose-free milk (or ½ cup cooking water); ½ tsp salt; ¼ tsp pepper","<b>Asparagus:</b> 2 bunches, ends snapped off; 1 tbsp olive oil; ¼ tsp salt"],
st:["Put the potatoes and garlic in a pot, cover with cold water by 1 inch, and add a pinch of salt. Boil, then simmer 15–18 min until fork-tender.","Meanwhile, heat the oven to 400°F, line 2 pans, and stir together the lemon-garlic oil.","Pat the cod dry, set it on one pan, and brush with the lemon-garlic oil. Toss the asparagus with oil and salt on the second pan.","Bake both pans 12–15 min, until the cod flakes easily (145°F). Thin pieces may be done at 8–10 min.","Save ½ cup potato water, drain, and mash the potatoes with the garlic, olive oil, warm milk (or water), salt, and pepper.","Serve the cod with lemon wedges, potatoes, and asparagus."],
plate:"7 oz cod, 300 g smashed potatoes, 1 cup asparagus. Pack the same for Sunday’s lunch.",tip:"Cod is delicate, so move it with a thin spatula. Give your son the thinner tail pieces."},
{t:"Crockpot Pork Carnitas Tacos with Pinto Beans and Roasted Zucchini and Eggplant",time:"Active 35 min (10 in the morning, 25 at dinner). Total about 7 hours.",
ing:["2½ lb pork loin roast, visible fat trimmed","<b>Rub:</b> 2 tsp cumin, 2 tsp chili powder, 1 tsp oregano, 1 tsp garlic powder, 1 tsp salt, ½ tsp pepper","1 onion, finely chopped","4 garlic cloves, minced","1 cup low-sodium chicken broth","Juice of 1 orange and 1 lime","2 cans (15 oz) pinto beans, drained and rinsed, plus ½ tsp cumin","<b>Vegetables:</b> 2 zucchini and 1 eggplant in ¾-inch cubes; 1½ tbsp olive oil; ½ tsp each salt, garlic powder, and smoked paprika","12–16 corn tortillas","½ cup shredded cheddar","Lime wedges (optional)"],
st:["<b>By 10 am:</b> press the rub over the pork. Put the onion and garlic in the crockpot, set the pork on top, and pour the broth and citrus juice around it. Cook on LOW 6–7 hours, until it shreds easily. Check at 6 hours, since loin is lean.","<b>45 min before dinner:</b> heat the oven to 425°F. Toss the vegetables with the oil and seasonings and roast 25–30 min, stirring halfway.","Shred the pork and stir it into the juices.","Optional: spread the pork on a sheet pan, drizzle with ½ cup juices, and broil 3–5 min to crisp the edges.","Warm the beans with the cumin and a splash of the juices for 5 min, mashing about a quarter of them.","Warm the tortillas in a dry skillet 30 seconds per side.","Build the tacos with pork, beans, vegetables, cheese, and lime."],
plate:"5 oz pork, 2 tortillas, ½ cup beans, 1 cup vegetables, ½ oz cheese. Pack Monday’s lunch as a bowl.",tip:"Leftover pork freezes well for a future taco night."}
],
2:[
{t:"Crockpot Teriyaki Pineapple Chicken with Brown Rice and Peas",time:"Active 20 min (10 at lunch, 10 at dinner). Total about 5 hours.",
ing:["2 lb boneless skinless chicken breasts","1 can (20 oz) pineapple chunks in juice, not drained","½ cup teriyaki sauce (lower-sodium if available)","3 garlic cloves, minced","½ small onion, finely chopped","½ tsp ground ginger","1 tbsp cornstarch mixed with 2 tbsp cold water","3 cups dry quick-cook brown rice","1 bag frozen peas"],
st:["<b>At lunch:</b> stir the pineapple with its juice, teriyaki, garlic, onion, and ginger in the crockpot.","Add the chicken and turn to coat. Cook on LOW 4–5 hours, to 165°F.","<b>At dinner:</b> cook the rice in a large pot (3 cups dry makes about 9 cups).","Slice or shred the chicken.","Simmer the sauce and pineapple in a saucepan, whisk in the cornstarch mixture, and cook 1–2 min until glossy. Stir the chicken back in.","Microwave the peas and serve everything over rice."],
plate:"5 oz chicken, 1 cup rice, ½ cup pineapple, ½ cup peas. Pack the same for Tuesday’s lunch.",tip:"Spread about 4 cups of the rice on a sheet pan to cool, refrigerate uncovered 30 min, then cover. Cold, dry rice makes the best fried rice."},
{t:"Pork Fried Rice",time:"Active 20 min. Total 20 min.",
ing:["2 lb boneless pork loin chops, trimmed, ½-inch pieces","¼ tsp black pepper and ¼ tsp ground ginger for the pork","1 tbsp + 1 tsp olive oil, divided","½ small onion, finely chopped","3 garlic cloves, minced","3 eggs, beaten","2 cups frozen peas and carrots","1 cup frozen corn","About 4 cups cold brown rice from Monday","3 tbsp low-sodium soy sauce","1 tsp sesame oil"],
st:["Season the pork with pepper and ginger. Heat 1 tbsp oil in your largest skillet over high heat.","Stir-fry the pork in a single layer 5–6 min, until no pink remains (145°F). Move it to a plate.","Lower to medium-high, add 1 tsp oil, the onion, and garlic. Cook 1 min.","Push everything aside, pour in the eggs, and scramble about 1 min.","Add the peas and carrots and the corn and cook 2 min.","Add the rice, press it flat, and let it sit 1–2 min to crisp, then stir.","Return the pork, add the soy sauce and sesame oil, and toss 2 min until hot."],
plate:"5 oz pork, 1 cup fried rice, ½ cup vegetables. Pack the same for Wednesday’s lunch.",tip:"Keep the heat high and don’t crowd the pan. Reheat with a splash of water."},
{t:"Crockpot White Chicken Chili",time:"Active 15 min (10 at lunch, 5 at dinner). Total about 5 hours.",
ing:["2 lb boneless skinless chicken breasts","2 cans (15 oz) great northern beans, drained and rinsed","1 cup frozen corn","2 cans (4 oz) diced mild green chiles","1 onion, finely chopped","4 garlic cloves, minced","2 tsp cumin, 1 tsp oregano, ½ tsp chili powder (optional)","½ tsp salt and ¼ tsp black pepper","2 cups low-sodium chicken broth","1 lime","<b>Toppings:</b> ½ cup shredded reduced-fat cheddar, tortilla chips (½ oz per person)"],
st:["<b>At lunch:</b> stir the onion, garlic, beans, corn, chiles, spices, salt, pepper, and broth in the crockpot. Lay the chicken on top.","Cook on LOW 4–5 hours, to 165°F.","<b>At dinner:</b> shred the chicken right in the crockpot.","Mash about ½ cup of beans with a little liquid and stir them back in to thicken. For thicker chili, cook uncovered on HIGH 10 more min.","Squeeze in the lime and taste for salt.","Top with cheddar and a few crushed chips."],
plate:"About 1¾ cups chili, ½ oz cheese, ½ oz chips. Pack Thursday’s lunch with the chips separate.",tip:"This chili freezes well in 2-cup containers."},
{t:"Crockpot French Dip Sandwiches with Oven Fries",time:"Active 25 min (10 at lunch, 15 at dinner). Total about 6 hours.",
ing:["3 lb bottom round roast, trimmed","1 tsp salt, 1 tsp garlic powder, ½ tsp pepper for the roast","1 onion, thinly sliced","3 garlic cloves, smashed","2 cups low-sodium beef broth","1 tbsp Worcestershire sauce","1 tsp dried thyme","6 whole-wheat hoagie rolls","6 slices provolone (½ oz each)","<b>Oven fries:</b> 2 lb russet potatoes, skins on, ½-inch sticks; 1 tbsp olive oil; ½ tsp each salt, garlic powder, and paprika"],
st:["<b>At lunch:</b> rub the roast with the salt, garlic powder, and pepper. Put the onion and garlic in the crockpot, set the roast on top, and add the broth, Worcestershire, and thyme. Cook on LOW 6 hours.","<b>At dinner:</b> heat the oven to 425°F and roast the fries 25–30 min, flipping halfway.","Rest the roast 5 min, then slice it as thin as you can against the grain.","Skim the fat off the cooking liquid. That’s your au jus. Keep it on WARM.","Toast the rolls under the broiler 1–2 min, pile on beef and onions, top with provolone, and broil 1–2 min more.","Serve with small cups of au jus for dipping."],
plate:"5 oz beef, 1 roll, ½ oz provolone, 150 g fries, ¼ cup au jus.",tip:"Dip instead of pouring the jus on, which keeps the sodium down. Pack Friday’s lunch with the beef and roll separate."},
{t:"Sheet-Pan Lemon-Herb Salmon Bites with Baby Potatoes and Asparagus",time:"Active 15 min. Total 35 min.",
ing:["2 lb skinless salmon, thawed, 1½-inch cubes","2 lb baby potatoes, halved","2 bunches asparagus, ends snapped off, 2-inch pieces","2 tbsp olive oil, divided","3 garlic cloves, minced","¾ tsp salt, divided","½ tsp smoked paprika","1 tsp Italian seasoning","1 lemon, zested, then cut into wedges","¼ tsp black pepper"],
st:["Heat the oven to 425°F and line 2 sheet pans.","Microwave the potatoes covered for 5 min. Toss with 1 tbsp oil, the garlic, ¼ tsp salt, and paprika, and roast on pan 1 for 15 min.","Toss the salmon with ½ tbsp oil, lemon zest, Italian seasoning, ¼ tsp salt, and pepper. Toss the asparagus with ½ tbsp oil and ¼ tsp salt on pan 2.","Push the potatoes aside, add the salmon to pan 1, and roast both pans 6–8 min, until the salmon flakes (145°F).","Finish with lemon."],
plate:"6 oz salmon, 300 g potatoes, 1 cup asparagus. Pack the same for Saturday’s lunch.",tip:"Cut the salmon into even cubes so they finish at the same time."},
{t:"Crispy Oven-Baked Cod Sandwiches, Sweet Potato Fries, Corn on the Cob",time:"Active 25 min. Total 40 min.",
ing:["2½ lb cod, thawed, bun-size pieces (about 5 oz each)","⅓ cup liquid egg whites beaten with 1 tbsp water","1½ cups panko (whole-wheat if available)","1 tsp smoked paprika, 1 tsp garlic powder, ½ tsp salt, ¼ tsp pepper","Olive oil spray","6 whole-wheat hamburger buns","<b>Yogurt tartar sauce:</b> ½ cup plain nonfat Greek yogurt, 1 tbsp dill pickle relish, 1 tsp lemon juice, pinch of salt","<b>Fries:</b> 2 lb sweet potatoes, skins on, ½-inch sticks; 1 tbsp olive oil; ½ tsp salt; ½ tsp smoked paprika","4 ears corn"],
st:["Heat the oven to 425°F. Toss the sweet potato sticks with oil and seasonings and roast 25–30 min, flipping halfway. Start these first.","Set a sprayed wire rack on a second pan. Mix the panko and seasonings in a shallow dish.","Pat the cod dry, dip in the egg whites, then press into the panko. Set on the rack and spray the tops.","When the fries have about 15 min left, bake the cod 12–15 min, until golden and flaky (145°F).","Boil the corn 5 min and stir together the tartar sauce.","Toast the buns and build the sandwiches."],
plate:"7 oz cod, 1 bun, 150 g fries, 1 ear corn. Pack the same for Sunday’s lunch.",tip:"Reheat leftover cod in the oven or air fryer at 375°F for 5–8 min to keep it crisp."},
{t:"Roast Chicken with Potatoes, Carrots, and Onion",time:"Active 15 min. Total about 1 hour 50 min.",
ing:["1 whole chicken (about 5 lb), giblets removed","2 tbsp olive oil, divided","4 garlic cloves (2 minced, 2 smashed)","1 tsp dried thyme, 1 tsp smoked paprika","1 tsp salt, divided, and ½ tsp pepper","1 lemon, halved","2 lb yellow potatoes, skins on, 1½-inch chunks","1 lb carrots, 2-inch pieces","1 onion, cut into wedges"],
st:["Heat the oven to 425°F. Pat the chicken completely dry inside and out.","Toss the potatoes, carrots, and onion in a roasting pan with 1 tbsp oil, ½ tsp salt, and the pepper.","Mix 1 tbsp oil with the minced garlic, thyme, paprika, and ½ tsp salt, and rub it all over the chicken.","Put the lemon halves and smashed garlic inside the chicken.","Set the chicken breast-side up on the vegetables and roast 75–90 min, until the thickest part of the thigh reaches 165°F.","Rest 15 min before carving, and stir the vegetables in the pan juices."],
plate:"6 oz chicken with skin removed, mostly breast meat, 250 g potatoes, 1 cup carrots. Pack the same for Monday’s lunch.",tip:"Pull the leftover meat off the bones the same night so it’s ready to pack."}
],
3:[
{t:"Crockpot Beef Barbacoa Bowls",time:"Active 20 min (10 at lunch, 10 at dinner). Total about 6 hours.",
ing:["3 lb bottom round roast, trimmed","<b>Rub:</b> 2 tsp cumin, 2 tsp dried oregano, 1 tsp chipotle chili powder (use ½ tsp for less heat), 1 tsp garlic powder, 1 tsp salt, ½ tsp pepper","1 onion, finely chopped","4 garlic cloves, minced","Juice of 2 limes","1 cup low-sodium beef broth","2 cups dry quick-cook brown rice","1 can (15 oz) black beans, drained and rinsed","1½ cups frozen corn, plus ½ tsp cumin","½ cup shredded cheddar","Lime wedges"],
st:["<b>At lunch:</b> mix the rub and press it all over the roast. Put the onion and garlic in the crockpot, set the roast on top, and pour the lime juice and broth around it.","Cook on LOW 6 hours, until it shreds easily. If it’s still firm at dinner, give it 30–60 min on HIGH.","<b>At dinner:</b> cook the rice. Warm the beans and corn with the cumin and a splash of water for 5 min.","Skim the fat off the juices, shred the beef with two forks, and toss it in the juices.","Build the bowls: rice, beef, beans and corn, a little cheese, and lime."],
plate:"5 oz beef, ¾ cup rice, ½ cup beans, ½ cup corn, ½ oz cheese. Pack the same for Tuesday’s lunch.",tip:"Extra barbacoa freezes well with some of its juices."},
{t:"Blackened Fish Tacos with Black Beans and Corn",time:"Active 20 min. Total 20 min.",
ing:["2½ lb cod or tilapia fillets, thawed","<b>Blackening spice:</b> 2 tsp smoked paprika, 1 tsp each garlic powder, onion powder, and cumin, ½ tsp oregano, ½ tsp salt, ¼ tsp pepper (pinch of cayenne optional)","1½ tbsp olive oil, divided","1 can (15 oz) black beans, drained and rinsed","1½ cups frozen corn, plus ½ tsp cumin","12–16 corn tortillas","2 limes, in wedges","<b>Lime yogurt sauce (optional):</b> ½ cup plain nonfat Greek yogurt, juice of ½ lime, pinch of salt"],
st:["Mix the blackening spice. Pat the fish dry and coat both sides.","Heat 1 tbsp oil in a large nonstick skillet over medium-high. Cook the fish in batches 3–4 min per side, until it flakes (145°F). Add the rest of the oil between batches.","Meanwhile, warm the beans and corn with the cumin and a splash of water.","Warm the tortillas in a dry skillet 30 seconds per side, and stir together the yogurt sauce.","Flake the fish and build the tacos with beans, corn, sauce, and lime."],
plate:"7 oz fish, 3 tortillas, ½ cup beans, ½ cup corn. Pack Wednesday’s lunch as a bowl with tortillas separate.",tip:"Don’t move the fish for the first 3 min so the spice forms a crust and it releases cleanly."},
{t:"Crockpot BBQ Pulled Pork Sandwiches, Corn on the Cob, Green Beans",time:"Active 20 min (10 at lunch, 10 at dinner). Total about 6 hours.",
ing:["2½ lb pork loin roast, trimmed","1 tsp smoked paprika, 1 tsp garlic powder, ½ tsp salt, ½ tsp pepper","1 onion, finely chopped","3 garlic cloves, minced","1 cup low-sodium chicken broth","¾ cup BBQ sauce","6 whole-wheat hamburger buns","4 ears corn","2 steam-in-bag packs frozen green beans"],
st:["<b>At lunch:</b> rub the pork with the paprika, garlic powder, salt, and pepper. Put the onion and garlic in the crockpot, set the pork on top, and add the broth.","Cook on LOW 6 hours, until it shreds easily. Check at 5½ hours, since loin is lean.","<b>At dinner:</b> boil the corn 5 min and microwave the green beans.","Shred the pork, pour off all but ¼ cup of the liquid, and stir in the BBQ sauce.","Toast the buns and pile on the pork."],
plate:"6 oz pork, 1 bun, 2 tbsp BBQ sauce, 1 ear corn, 1 cup green beans. Pack Thursday’s lunch with the bun separate.",tip:"Measure the BBQ sauce. It adds sugar and sodium quickly."},
{t:"Crockpot Chicken Noodle Soup",time:"Active 20 min (10 at lunch, 10 at dinner). Total about 5 hours.",
ing:["2 lb boneless skinless chicken breasts","4 carrots, sliced","1 onion, chopped","3 garlic cloves, minced","1 tsp dried thyme and 1 bay leaf","½ tsp salt and ¼ tsp pepper","8 cups low-sodium chicken broth","1½ cups frozen peas","12 oz whole-wheat egg noodles or rotini","1 tbsp lemon juice (optional)"],
st:["<b>At lunch:</b> put the carrots, onion, garlic, thyme, bay leaf, salt, pepper, and broth in the crockpot. Lay the chicken on top.","Cook on LOW 4–5 hours, to 165°F.","<b>At dinner:</b> shred the chicken, return it to the pot, and stir in the peas. Cook 5 min on HIGH and remove the bay leaf.","Boil the noodles separately 8 min and drain.","Put noodles in each bowl, ladle the soup over, and add a squeeze of lemon."],
plate:"6 oz chicken, 1¼ cups noodles, 1 cup vegetables with broth. Pack Friday’s lunch in a thermos.",tip:"Store the noodles separately from the soup so they don’t turn mushy."},
{t:"Sheet-Pan Pork Chops with Apples, Sweet Potatoes, and Brussels Sprouts",time:"Active 15 min. Total 30 min.",
ing:["2 lb boneless pork chops (¾–1 inch thick)","2 lb sweet potatoes, skins on, ¾-inch cubes","1½ lb Brussels sprouts, halved","2 apples, cored and cut into wedges","2 tbsp olive oil, divided","½ tsp cinnamon","¾ tsp salt, divided, and ½ tsp pepper","<b>For the chops:</b> 1 tsp garlic powder, 1 tsp dried thyme, ½ tsp smoked paprika"],
st:["Heat the oven to 425°F and line 2 pans.","Toss the sweet potatoes and sprouts with 1½ tbsp oil and ½ tsp salt, and sprinkle the cinnamon on the sweet potatoes. Spread across both pans and roast 10 min.","Season the chops with the garlic powder, thyme, paprika, ¼ tsp salt, and pepper, and brush with ½ tbsp oil.","Add the chops and apple wedges to the pans and roast 12–15 min, until the chops reach 145°F.","Rest the chops 3 min before serving."],
plate:"6 oz pork chop, 200 g sweet potato, ½ apple, 1 cup sprouts. Pack the same for Saturday’s lunch.",tip:"Chops thinner than ¾ inch may be done in 8–10 min. Check early."},
{t:"Meatloaf, Mashed Potatoes, Roasted Asparagus",time:"Active 25 min. Total about 1 hour 15 min.",
ing:["2 lb 93/7 lean ground beef","1 egg","½ cup old-fashioned oats","1 small onion, very finely chopped","2 garlic cloves, minced","1 tbsp Worcestershire sauce","1 tsp Italian seasoning","½ tsp salt and ½ tsp pepper","¼ cup lactose-free milk or broth","⅓ cup BBQ sauce for the glaze","<b>Potatoes:</b> 2½ lb russet potatoes, skins on, in chunks; 3 garlic cloves; 1 tbsp olive oil; ⅓ cup warm lactose-free milk or broth; ½ tsp salt","<b>Asparagus:</b> 2 bunches; 1 tbsp olive oil; ¼ tsp salt"],
st:["Heat the oven to 375°F and line a sheet pan.","Gently mix the beef, egg, oats, onion, garlic, Worcestershire, seasoning, salt, pepper, and milk. Don’t overmix.","Shape into a loaf about 9 by 5 inches on the pan and brush with half the glaze. Bake 40 min.","Brush on the rest of the glaze and bake 15–20 min more, to 160°F. Rest 10 min.","While it bakes, simmer the potatoes and garlic 15–18 min, drain, and mash with the oil, milk, and salt.","Roast the asparagus with oil and salt for the last 12–15 min."],
plate:"6 oz meatloaf, 300 g potatoes, 1 cup asparagus. Pack the same for Sunday’s lunch.",tip:"The oats keep lean meatloaf moist and add soluble fiber."},
{t:"Honey-Garlic Baked Salmon, Brown Rice, Peas, and Roasted Carrots",time:"Active 10 min. Total 35 min.",
ing:["2 lb salmon fillets, thawed","<b>Glaze:</b> 2 tbsp honey, 2 tbsp low-sodium soy sauce, 3 minced garlic cloves, 1 tsp lemon juice","1½ lb carrots, sliced on the diagonal","1 tbsp olive oil and ¼ tsp salt","2 cups dry quick-cook brown rice","1½ cups frozen peas"],
st:["Heat the oven to 400°F and line a sheet pan. Toss the carrots with the oil and salt and roast 10 min.","Start the rice and whisk the glaze.","Push the carrots aside, add the salmon, and brush with half the glaze. Roast 12–15 min, until it flakes (145°F).","Brush on the rest of the glaze and microwave the peas."],
plate:"6 oz salmon, ¾ cup rice, ½ cup peas, 1 cup carrots. Pack the same for Monday’s lunch.",tip:"Line the pan, since honey glaze burns onto bare metal."}
],
4:[
{t:"Crockpot Garlic-Herb Pork Chops and Potatoes with Gravy, Green Beans",time:"Active 20 min (10 at lunch, 10 at dinner). Total about 5 hours.",
ing:["2½ lb thick-cut (1-inch) boneless pork chops","2 lb yellow potatoes, quartered","1 onion, sliced","4 garlic cloves, minced","1 tsp dried thyme, ½ tsp dried rosemary (crushed), ½ tsp paprika","1 tsp salt, divided, and ½ tsp pepper","1 cup low-sodium chicken broth","1 tbsp cornstarch mixed with 2 tbsp cold water","2 steam-in-bag packs frozen green beans"],
st:["<b>At lunch:</b> put the potatoes and onion in the crockpot with ¼ tsp salt.","Season the chops with the thyme, rosemary, paprika, remaining salt, and pepper, and lay them on the potatoes. Scatter the garlic and pour in the broth.","Cook on LOW 5 hours. Thinner chops dry out past that.","<b>At dinner:</b> move the chops and potatoes to a platter. Simmer the cooking liquid in a saucepan, whisk in the cornstarch mixture, and cook 1–2 min for gravy.","Microwave the green beans and serve."],
plate:"6 oz pork chop, 250 g potatoes, 2 tbsp gravy, 1 cup green beans. Pack the same for Tuesday’s lunch.",tip:"Buy chops at least 1 inch thick. They stay juicy in the crockpot."},
{t:"Soy-Honey Salmon Rice Bowls with Edamame and Carrots",time:"Active 15 min. Total 25 min.",
ing:["2 lb salmon fillets, thawed","<b>Sauce:</b> ¼ cup low-sodium soy sauce, 2 tbsp honey, 1 tsp sesame oil, 2 minced garlic cloves, ½ tsp ground ginger","2 cups dry quick-cook brown rice","2 cups frozen shelled edamame","3 carrots, thinly sliced"],
st:["Heat the oven to 400°F and line a pan. Start the rice.","Whisk the sauce and set half aside in a separate bowl for serving.","Brush the salmon with the other half and bake 12–15 min, until it flakes (145°F).","Microwave the edamame and carrots in a covered bowl with 2 tbsp water for 4–5 min.","Build the bowls with rice, flaked salmon, edamame, and carrots, and drizzle the reserved sauce."],
plate:"6 oz salmon, ¾ cup rice, ½ cup edamame, ½ cup carrots. Pack the same for Wednesday’s lunch.",tip:"Keep the serving sauce separate from the brush you used on the raw fish."},
{t:"Crockpot Cumin-Lime Chicken Tacos",time:"Active 20 min (10 at lunch, 10 at dinner). Total about 5 hours.",
ing:["2 lb boneless skinless chicken breasts","2 tsp cumin, 2 tsp mild chili powder, 1 tsp garlic powder, ½ tsp oregano","½ tsp salt and ¼ tsp pepper","1 onion, finely chopped","3 garlic cloves, minced","Juice of 2 limes","½ cup low-sodium chicken broth","1 can (15 oz) black beans, drained and rinsed","1 cup frozen corn","12 whole-wheat tortillas (8-inch)","½ cup shredded cheddar","<b>Lime yogurt sauce (optional):</b> ½ cup plain nonfat Greek yogurt, juice of ½ lime, pinch of salt"],
st:["<b>At lunch:</b> put the onion and garlic in the crockpot, lay the chicken on top, and sprinkle on the spices, salt, and pepper. Pour the lime juice and broth around it.","Cook on LOW 4–5 hours, to 165°F.","<b>At dinner:</b> shred the chicken and let it sit in the juices 5 min to soak them up.","Warm the beans and corn, and warm the tortillas in a dry skillet.","Build the tacos with chicken, beans, corn, cheese, and the yogurt sauce."],
plate:"5 oz chicken, 2 tortillas, ½ cup beans, ¼ cup corn, ½ oz cheese. Pack Thursday’s lunch with the tortillas separate.",tip:"Use mild chili powder and add hot sauce at the table for the adults."},
{t:"Crockpot Beef Stew with Crusty Bread",time:"Active 25 min (20 at lunch, 5 at dinner). Total about 6 hours.",
ing:["2½ lb bottom round or eye of round, trimmed, 1½-inch cubes","2 tbsp flour, ½ tsp salt, ½ tsp pepper","1½ lb yellow potatoes, cubed","1 lb carrots, thick coins","1 onion, chopped","3 garlic cloves, minced","1 tsp dried thyme and 1 bay leaf","1 tbsp Worcestershire sauce","3 cups low-sodium beef broth","1½ cups frozen peas","1 crusty whole-grain loaf"],
st:["<b>At lunch:</b> toss the beef with the flour, salt, and pepper.","Put the potatoes, carrots, onion, and garlic in the crockpot, then the beef. Add the thyme, bay leaf, Worcestershire, and broth.","Cook on HIGH 5–6 hours. If the beef is still firm at dinner, give it 30 more min.","<b>At dinner:</b> stir in the peas for 5 min and remove the bay leaf. If it’s thin, mash a few potato chunks into the broth.","Serve with sliced bread."],
plate:"5 oz beef, 200 g potatoes, 1 cup carrots and peas, 1 slice bread. Pack Friday’s lunch in a thermos.",tip:"Lean cuts get tender when the cubes are small and the stew stays covered the whole time."},
{t:"Garlic-Parmesan Chicken Pasta with Zucchini and Peas",time:"Active 25 min. Total 25 min.",
ing:["1 lb whole-wheat pasta (penne or rotini)","2 lb chicken breasts, 1-inch pieces","½ tsp salt, ½ tsp pepper, 1 tsp Italian seasoning","1½ tbsp olive oil, divided","3 zucchini, diced","4 garlic cloves, minced","1 cup frozen peas","½ cup lactose-free milk","½–1 cup reserved pasta water","⅓ cup grated parmesan","Squeeze of lemon (optional)"],
st:["Cook the pasta according to the package. Save 1 cup of the water before draining.","Meanwhile, heat 1 tbsp oil in a large skillet over medium-high. Season the chicken and cook 6–8 min, to 165°F. Move it to a plate.","Add ½ tbsp oil and the zucchini and cook 4–5 min. Add the garlic for 30 seconds.","Add the peas, milk, and ½ cup pasta water and simmer 2 min.","Take the pan off the heat, stir in the parmesan, then add the pasta and chicken. Loosen with more pasta water if needed."],
plate:"5 oz chicken, 1¼ cups pasta, 1 cup zucchini and peas, ½ oz parmesan. Pack the same for Saturday’s lunch.",tip:"Add the parmesan off the heat so it melts smoothly instead of clumping."},
{t:"Parmesan-Crusted Tilapia, Sweet Potato Fries, Corn on the Cob",time:"Active 20 min. Total 40 min.",
ing:["2½ lb tilapia fillets, thawed","⅓ cup liquid egg whites","¾ cup panko and ¼ cup grated parmesan","1 tsp garlic powder, 1 tsp paprika, ¼ tsp salt, ¼ tsp pepper","Olive oil spray and lemon wedges","<b>Fries:</b> 2 lb sweet potatoes, skins on, ½-inch sticks; 1 tbsp olive oil; ½ tsp salt; ½ tsp smoked paprika","4 ears corn"],
st:["Heat the oven to 425°F. Toss the fries with oil and seasonings and roast 25–30 min, flipping halfway.","Mix the panko, parmesan, and seasonings.","Pat the tilapia dry, brush the tops with egg white, and press on the crumb mixture. Set on a lined, sprayed pan and spray the tops.","When the fries have about 12 min left, bake the fish 10–12 min, until it flakes (145°F).","Boil the corn 5 min and serve with lemon."],
plate:"7 oz tilapia, 150 g fries, 1 ear corn. Pack the same for Sunday’s lunch.",tip:"Reheat leftover fish in the oven or air fryer to keep the crust crisp."},
{t:"Pork Loin Roast with Apples, Onions, Potatoes, and Carrots",time:"Active 15 min. Total about 1 hour 15 min.",
ing:["2½ lb pork loin roast, trimmed","<b>Rub:</b> 3 minced garlic cloves, 1 tsp dried thyme, 1 tsp dried rosemary (crushed), 1 tsp salt, ½ tsp pepper, 1 tbsp olive oil","1½ lb yellow potatoes, chunks","1 lb carrots, 2-inch pieces","2 apples, cut into wedges","1 onion, cut into wedges","1 tbsp olive oil and ¼ tsp salt for the vegetables"],
st:["Heat the oven to 400°F.","Toss the potatoes, carrots, apples, and onion with the oil and salt on a large sheet pan or roasting pan.","Rub the pork all over and set it in the middle of the pan.","Roast 50–60 min, to 145°F. Start checking at 45 min.","Rest 10 min, then slice ½ inch thick."],
plate:"6 oz pork, 200 g potatoes, 1 cup carrots, some roasted apple and onion. Pack the same for Monday’s lunch.",tip:"A thermometer matters most here. Pork loin goes from juicy to dry in about 5 minutes."}
]};

oats:{t:"Overnight Oats (1 jar)",time:"Active 3 min per jar. Keeps 4 days in the fridge.",
ing:["¾ cup (60 g) old-fashioned rolled oats","1 tbsp ground flaxseed","½ tsp cinnamon and a pinch of salt","1 cup plain nonfat Greek yogurt","½ cup unsweetened soy milk","½ oz (about 2 tbsp) chopped walnuts","Flavor of the week (below)"],
st:["Stir the oats, flaxseed, cinnamon, and salt together in a pint mason jar.","Add the yogurt and soy milk and stir until no dry oats remain.","Add the walnuts and the flavor of the week, close the lid, and refrigerate at least 6 hours.","Stir before eating. Add a splash of soy milk if it’s too thick."]},
flav:{1:"<b>Berry-walnut:</b> 1 cup fresh or frozen berries on top.",2:"<b>Banana-walnut:</b> ½ banana and an extra ¼ tsp cinnamon. Slice the banana on in the morning so it doesn’t brown.",3:"<b>Apple-cinnamon:</b> ½ apple, diced, and an extra ¼ tsp cinnamon.",4:"<b>Cherry-cocoa:</b> 1 cup frozen cherries (they thaw overnight) and 1 tbsp unsweetened cocoa powder stirred in."},
frz:{
1:{t:"Optional: Freezer Breakfast Burritos (makes 8)",time:"Active 35 min on Sunday. 2 min to reheat. Up to twice a week.",ing:["8 whole-wheat tortillas (8-inch)","4 eggs + 2⅔ cups liquid egg whites","400 g yellow potatoes, diced ½ inch, plus 1 tsp olive oil","1 can black beans, drained and rinsed","½ cup shredded cheddar","½ tsp each cumin, garlic powder, smoked paprika; ¼ tsp each salt and pepper"],st:["Microwave the potatoes covered 4 min, then pan-fry in the oil 6–8 min with the paprika, garlic powder, and salt.","Whisk the eggs, whites, cumin, and pepper and scramble over medium-low until just set.","Cool the fillings 15 min so the tortillas don’t get soggy.","Warm the tortillas 20 seconds, fill each with eggs, potatoes, about 3 tbsp beans, and 1 tbsp cheese, and roll tightly.","Wrap each in foil, freeze in a gallon bag, and use within a month. To reheat, unwrap, wrap in a damp paper towel, and microwave about 2 min, flipping halfway."]},
2:{t:"Optional: Egg and Cheese English Muffin Sandwiches (makes 8)",time:"Active 20 min on Sunday. 2 min to reheat. Up to twice a week.",ing:["4 eggs + 2⅔ cups liquid egg whites","½ tsp garlic powder, ¼ tsp salt, ¼ tsp pepper","Olive oil spray","8 whole-wheat English muffins","8 slices reduced-fat cheddar"],st:["Heat the oven to 350°F and spray a 9×13 dish.","Whisk the eggs, whites, and seasonings, pour into the dish, and bake 18–22 min until set. Cool 10 min and cut into 8 squares.","Lightly toast the muffins and build each sandwich with an egg square and a slice of cheese.","Cool completely, wrap each in a paper towel then foil, and freeze. To reheat, remove the foil and microwave 1 min, flip, then 30–45 seconds more."]},
3:{t:"Optional: Egg Muffin Cups (makes 12)",time:"Active 15 min. Keeps 5 days in the fridge. Up to twice a week.",ing:["3 eggs + 2 cups liquid egg whites","1 small zucchini, finely diced","¼ onion, finely chopped","½ cup shredded cheddar","¼ tsp each salt, pepper, and garlic powder","Olive oil spray"],st:["Heat the oven to 350°F and spray a 12-cup muffin tin.","Divide the zucchini, onion, and cheese among the cups.","Whisk the eggs, whites, and seasonings and pour over the fillings.","Bake 20–22 min, until set in the center. Cool and refrigerate. Grab 4 cups with a whole-wheat English muffin."]},
4:{t:"Optional: Sweet Potato and Black Bean Burritos (makes 8)",time:"Active 35 min on Sunday. 2 min to reheat. Up to twice a week.",ing:["8 whole-wheat tortillas (8-inch)","4 eggs + 2⅔ cups liquid egg whites","400 g sweet potato, diced ½ inch, plus 1 tsp olive oil","1 can black beans, drained and rinsed","½ cup shredded cheddar","½ tsp cumin, ½ tsp smoked paprika, ¼ tsp salt, ¼ tsp pepper"],st:["Roast the sweet potato with the oil, paprika, and salt at 425°F for 20–25 min.","Scramble the eggs and whites with the cumin and pepper until just set.","Cool the fillings 15 min.","Fill the warmed tortillas, roll tightly, wrap in foil, and freeze.","To reheat, unwrap, wrap in a damp paper towel, and microwave about 2 min, flipping halfway."]}
}};

  function notesFor(i){
    var w=weekOf(i), p=phaseOf(w), out=[];
    if(w===10) out.push("<b>Deload and diet break.</b> Half the sets at the same weights and about half the running. Eat at maintenance, about 2,600 calories, by adding carbs. Take it even if you feel fine.");
    else if(w===15) out.push("<b>Deload week.</b> Half the sets at the same weights and about half the running and conditioning. Take it even if you feel fine.");
    else if(w===21) out.push("<b>Taper and final testing.</b> Half the sets, sharp but short sessions, and your final tests.");
    if(w===6) out.push("<b>Thanksgiving week.</b> If plans cut into your sessions, drop Friday’s intervals first and keep both lower-body days.");
    if(w===16||w===17) out.push("<b>Fuel for soccer.</b> Once your 7-day average reaches 158–160 lb, move up to maintenance (about 2,600 calories) by adding carbs. By Week 18 at the latest.");
    if(w>=18&&w!==21) out.push("<b>Maintenance calories.</b> You’re fueling for soccer now, so targets are about 2,600 a day. Keep protein and the heart-health rules the same.");
    if(w>=3&&w<=8) out.push("<b>Careful zone.</b> Weeks 3–8 are when returning players most often get hurt. Feeling great is a reason to bank it, not add more.");
    return out;
  }

    RCP[mw].forEach(function(r,d){var D=DIN[mw][d];h+=rCard(mw+"-"+d,DOW[d]+(D.crock?(D.when==="morning"?", crockpot in the morning":", crockpot at lunch"):""),r,"<p><span class=\"mac\">"+D.mac+", "+D.cal+" cal per plate</span></p>");});
    h+="</ul></div><div class=\"group\"><h3>Breakfasts</h3><ul class=\"rlist\">";
    h+=rCard("b-oats-"+mw,"Every day",{t:BFAST.oats.t+": "+OATS[mw][0].toLowerCase(),time:BFAST.oats.time,ing:BFAST.oats.ing,st:BFAST.oats.st},"<p>"+BFAST.flav[mw]+"</p><p><span class=\"mac\">39 P / 18 F / 74 C, 13 g fiber, ~615 cal</span></p>");
    h+=rCard("b-frz-"+mw,"Up to twice a week",BFAST.frz[mw]);
    h+="</ul></div></section>";return h;
  }
  function groceryHtml(){
    var mw=ui.gw, gs=gSet(mw), tot=0, dn=0;
    GROC[mw].forEach(function(sec,si){sec[1].forEach(function(x,ii){tot++;if(gs.has(si+"-"+ii))dn++;});});
    var h="<section class=\"panel food\" role=\"tabpanel\" id=\"panel-top\"><h2 class=\"session-title\">Week "+mw+" groceries</h2><p class=\"session-meta\">Shop Saturday or Sunday and check items off as you go. "+dn+" of "+tot+" done.</p>"+chips("gw",mw);
    GROC[mw].forEach(function(sec,si){
      h+="<div class=\"group\"><h3>"+sec[0]+"</h3><ul class=\"tasks\">"+sec[1].map(function(x,ii){var id=si+"-"+ii,d=gs.has(id);return "<li class=\"task"+(d?" done":"")+"\"><button type=\"button\" class=\"check\" data-gi=\""+id+"\" aria-pressed=\""+d+"\" aria-label=\""+(d?"Uncheck ":"Check ")+x.replace(/<[^>]+>/g,"")+"\">"+CHECK+"</button><div class=\"tbody\"><button type=\"button\" class=\"ttl\" data-gi=\""+id+"\">"+x+"</button></div></li>";}).join("")+"</ul></div>";
    });
    h+="<p class=\"foot\"><button type=\"button\" class=\"lnk\" data-gclear=\"1\">Clear this week’s checks</button> before you shop for it again.</p></section>";
    return h;
  }

  function render(){
    var i=cur, d=dateOf(i), w=weekOf(i), dw=dowOf(i), p=phaseOf(w), set=doneSet(i);
    var T=training(i), N=nutrition(i);
    var h="";
    h+="<section class=\"hero\"><h1 class=\"hero-date\">"+DOW[dw]+"<br>"+MON[d.getMonth()]+" "+d.getDate()+"</h1>";
    h+="<div class=\"hero-sub\"><span>Week "+w+" of 21</span><span class=\"pill\">"+PHASE[p]+"</span><span class=\"pill food\">"+(N.targets.maint?"Maintenance":N.dt==="hard"?"Hard day":N.dt==="moderate"?"Moderate day":"Rest day")+"</span>"+(DELOAD[w]?"<span class=\"pill plain\">Deload</span>":"")+"</div></section>";

    h+="<div class=\"season\" role=\"group\" aria-label=\"21-week season\"><div class=\"season-bar\">";
    for(var k=1;k<=21;k++){h+="<button type=\"button\" class=\"seg p"+phaseOf(k)+(k===w?" cur":"")+(DELOAD[k]?" dl":"")+"\" data-week=\""+k+"\" aria-label=\"Week "+k+", "+PHASE[phaseOf(k)]+(DELOAD[k]?", deload":"")+"\"></button>";}
    h+="</div><div class=\"season-key\"><span>Oct 19</span><span>Phases 1–4</span><span>Mar 14</span></div></div>";

    var ws=(w-1)*7;
    h+="<div class=\"week\"><button type=\"button\" class=\"wk-nav\" data-week=\""+(w-1)+"\" aria-label=\"Previous week\""+(w===1?" disabled":"")+">‹</button><div class=\"days\">";
    for(var j=0;j<7;j++){var di=ws+j, dd=dateOf(di), f=frac(di), pct=f[1]?Math.round(100*f[0]/f[1]):0;
      h+="<button type=\"button\" class=\"day"+(di===i?" sel":"")+(di===todayI?" today":"")+"\" data-day=\""+di+"\" aria-label=\""+DOW[j]+" "+MON[dd.getMonth()]+" "+dd.getDate()+", "+f[0]+" of "+f[1]+" done\"><span class=\"dl1\">"+DOW1[j]+"</span><span class=\"dn\">"+dd.getDate()+"</span><span class=\"bar\"><i style=\"width:"+pct+"%\"></i></span></button>";}
    h+="</div><button type=\"button\" class=\"wk-nav\" data-week=\""+(w+1)+"\" aria-label=\"Next week\""+(w===21?" disabled":"")+">›</button></div>";

    var notes=notesFor(i);
    if(todayI<0&&i===0) notes.unshift("<b>The plan starts Monday, October 19.</b> Here’s your first day.");
    if(todayI>=TOTAL&&i===TOTAL-1) notes.unshift("<b>You finished the 21 weeks.</b> Time to book your final DXA and get on the field.");
    if(notes.length) h+="<div class=\"notes\">"+notes.map(function(n){return "<div class=\"note\">"+n+"</div>";}).join("")+"</div>";

    var f0=frac(i), tc=0, tt=0, nc=0, nt=0;
    T.groups.forEach(function(g){g.items.forEach(function(x){tt++;if(set.has("t-"+x.id))tc++;});});
    N.groups.forEach(function(g){g.items.forEach(function(x){nt++;if(set.has("n-"+x.id))nc++;});});
    h+="<div class=\"progress\"><div class=\"track\"><i style=\"width:"+(f0[1]?Math.round(100*f0[0]/f0[1]):0)+"%\"></i></div><span>"+f0[0]+" of "+f0[1]+" done</span></div>";

    h+=tabsHtml(tc,tt,nc,nt);

    if(ui.tab==="t"){
      var S=T.groups[1];
      h+="<section class=\"panel\" role=\"tabpanel\"><h2 class=\"session-title\">"+S.h+"</h2><p class=\"session-meta\">"+S.s+(S.note?". "+S.note:"")+"</p>";
      T.groups.forEach(function(g,gi){
        h+="<div class=\"group\"><h3>"+(gi===0?g.h:"Session")+"<small>"+(gi===0?g.s:S.s)+"</small></h3><ul class=\"tasks\">"+g.items.map(function(x){return taskHtml(i,"t-",x,set);}).join("")+"</ul></div>";
      });
      h+="</section>";
    } else if(ui.tab==="f"){
      var tv=N.targets.v;
      h+="<section class=\"panel food\" role=\"tabpanel\"><h2 class=\"session-title\">"+(N.targets.maint?"Maintenance day":N.dt==="hard"?"Hard training day":N.dt==="moderate"?"Moderate day":"Rest day")+"</h2><p class=\"session-meta\">Daily targets</p>";
      h+="<div class=\"targets\"><div class=\"t-box\"><b>"+tv[0]+"</b><span>calories</span></div><div class=\"t-box\"><b>"+tv[1]+"</b><span>protein g</span></div><div class=\"t-box\"><b>"+tv[2]+"</b><span>fat g</span></div><div class=\"t-box\"><b>"+tv[3]+"</b><span>carbs g</span></div><div class=\"t-box\"><b>"+tv[4]+"</b><span>fiber g</span></div></div>";
      if(N.targets.maint) h+="<p class=\"session-meta\">Reach maintenance by adding carbs: a bigger starch portion at lunch and dinner and an extra fruit.</p>";
      N.groups.forEach(function(g){
        h+="<div class=\"group\"><h3>"+g.h+(g.s?"<small>"+g.s+"</small>":"")+"</h3><ul class=\"tasks\">"+g.items.map(function(x){return taskHtml(i,"n-",x,set);}).join("")+"</ul></div>";
      });
      h+="</section>";
    } else if(ui.tab==="r"){
      h+=recipesHtml();
    } else {
      h+=groceryHtml();
    }
    if(ui.tab==="t"||ui.tab==="f") h+="<p class=\"foot\">Check-offs are saved in this browser on this device.</p>";
    app.innerHTML=h;
    document.getElementById("todayBtn").disabled=(cur===clamp(todayI));
  }

  app.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-goto")){ui.tab=b.getAttribute("data-goto");var gw=+b.getAttribute("data-w");if(ui.tab==="r"){ui.rw=gw;ui.openR=gw+"-"+b.getAttribute("data-d");}else{ui.gw=gw;}saveTab();render();var el=document.getElementById("panel-top");if(el)window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+window.scrollY-150));return;}
    if(b.hasAttribute("data-rw")){ui.rw=+b.getAttribute("data-rw");render();return;}
    if(b.hasAttribute("data-gw")){ui.gw=+b.getAttribute("data-gw");render();return;}
    if(b.hasAttribute("data-rx")){var rk=b.getAttribute("data-rx");ui.openR=(ui.openR===rk?"":rk);render();return;}
    if(b.hasAttribute("data-gi")){gToggle(ui.gw,b.getAttribute("data-gi"));render();return;}
    if(b.hasAttribute("data-gclear")){store["groc-"+ui.gw]=[];save();render();return;}
    if(b.hasAttribute("data-task")){toggle(cur,b.getAttribute("data-task"));render();return;}
    if(b.hasAttribute("data-expand")){var ek=key(cur)+"|"+b.getAttribute("data-expand");open[ek]=!open[ek];var det=b.parentNode.querySelector(".detail");if(det){det.hidden=!open[ek];b.setAttribute("aria-expanded",String(!!open[ek]));}return;}
    if(b.hasAttribute("data-day")){cur=clamp(+b.getAttribute("data-day"));setDefaults();render();return;}
    if(b.hasAttribute("data-week")){var wk=+b.getAttribute("data-week");if(wk<1||wk>21)return;var dw=dowOf(cur);cur=clamp((wk-1)*7+dw);setDefaults();render();return;}
    if(b.hasAttribute("data-tab")){ui.tab=b.getAttribute("data-tab");if(ui.tab==="r"||ui.tab==="g")setDefaults();saveTab();render();return;}
  });
  document.getElementById("todayBtn").addEventListener("click",function(){cur=clamp(indexOf(new Date()));setDefaults();render();window.scrollTo(0,0);});
  setDefaults();
  render();
})();
</script>
</body>
</html>
